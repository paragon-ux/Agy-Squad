<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="crestShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Governance Crest -->
  <path d="M 64 12 L 109 38 L 109 90 L 64 116 L 19 90 L 19 38 Z"
        fill="none"
        stroke="url(#crestGrad)"
        stroke-width="5"
        stroke-linejoin="round"
        filter="url(#crestShadow)" />

  <!-- Inner Scoped Facet -->
  <path d="M 64 24 L 99 44 L 99 84 L 64 104 L 29 84 L 29 44 Z"
        fill="url(#crestGrad)"
        fill-opacity="0.12"
        stroke="url(#sealGrad)"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Coordinated Squad Mesh Perimeter -->
  <path d="M 64 40 L 43 78 L 85 78 Z"
        fill="none"
        stroke="#818CF8"
        stroke-opacity="0.45"
        stroke-width="1.8"
        stroke-dasharray="3 3"
        stroke-linejoin="round" />

  <!-- Pointer-Over-Wire Routing Lines to Verification Seal -->
  <line x1="64" y1="46" x2="64" y2="54" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="48" y1="75" x2="57" y2="69" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="75" x2="71" y2="69" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />

  <!-- Central SHA-256 Verification Diamond Seal -->
  <path d="M 64 53 L 75 64 L 64 75 L 53 64 Z"
        fill="url(#sealGrad)"
        stroke="#E0F2FE"
        stroke-width="1.5"
        stroke-linejoin="round" />
  <path d="M 64 59 L 69 64 L 64 69 L 59 64 Z"
        fill="#1E1B4B"
        fill-opacity="0.4" />

  <!-- Three Scoped Squad Nodes (Lead Apex + Two Specialist Wings) -->
  <circle cx="64" cy="40" r="6" fill="#38BDF8" />
  <circle cx="43" cy="78" r="5.5" fill="#818CF8" />
  <circle cx="85" cy="78" r="5.5" fill="#818CF8" />
</svg>
