<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 548" width="820" height="548" style="max-width:100%;height:auto" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Agy-Squad, Google Antigravity, and Agy-Context-Saver Architecture</title>
  <desc id="arch-desc">Three-layer overview showing Agy-Squad planning and proof verification above Google Antigravity's native swarm runtime and the optional Agy-Context-Saver hook and forensics companion.</desc>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #57606a;
      --card: #ffffff;
      --band-squad: #f2f7fd;
      --band-squad-border: #80b3f2;
      --band-runtime: #f6f8fa;
      --band-runtime-border: #d0d7de;
      --band-acs: #f7f4fc;
      --band-acs-border: #c2a8f0;
      --card-border: #d0d7de;
      --accent: #0969da;
      --purple: #6639ba;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9ea7b3;
        --line: #8b949e;
        --card: #161b22;
        --band-squad: #121d2b;
        --band-squad-border: #2f5d96;
        --band-runtime: #161b22;
        --band-runtime-border: #30363d;
        --band-acs: #1b1726;
        --band-acs-border: #55407d;
        --card-border: #30363d;
        --accent: #58a6ff;
        --purple: #bc8cff;
      }
    }
    text { font-family: var(--font); fill: var(--fg); }
    .band-title { font-size: 13px; font-weight: 600; }
    .band-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .node-title { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub { font-size: 12px; font-weight: 400; fill: var(--muted); text-anchor: middle; }
    .edge-label { font-size: 12px; font-weight: 500; fill: var(--muted); text-anchor: middle; }
    .arrow-line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; }
    .arrow-head { fill: var(--line); }
  </style>

  <!-- Self-contained adaptive canvas background (seamless on GitHub/Zensical light and dark) -->
  <rect x="0" y="0" width="820" height="548" rx="12" fill="var(--bg)"/>

  <!-- Layer 1: Agy-Squad -->
  <g id="layer-squad">
    <rect x="12" y="12" width="796" height="136" rx="10" fill="var(--band-squad)" stroke="var(--band-squad-border)" stroke-width="1.25"/>
    <text class="band-title" x="28" y="36" style="fill:var(--accent)">Agy-Squad<tspan class="band-sub" dx="10">Planning, Governance &amp; Proof</tspan></text>

    <!-- Node A1 -->
    <rect x="28" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="84">Plan &amp; Scope</text>
    <text class="node-sub" x="144" y="105">Assign roles &amp; file boundaries</text>

    <!-- A1 -> A2 -->
    <line class="arrow-line" x1="260" y1="91" x2="286" y2="91"/>
    <polygon class="arrow-head" points="294,91 285,86.5 285,95.5"/>

    <!-- Node A2 -->
    <rect x="294" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="84">Scoped Briefs &amp; Reports</text>
    <text class="node-sub" x="410" y="105">File reports &amp; short receipts</text>

    <!-- A2 -> A3 -->
    <line class="arrow-line" x1="526" y1="91" x2="552" y2="91"/>
    <polygon class="arrow-head" points="560,91 551,86.5 551,95.5"/>

    <!-- Node A3 -->
    <rect x="560" y="52" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="84">agy-squad CLI</text>
    <text class="node-sub" x="676" y="105">Verify &amp; seal proof bundles</text>
  </g>

  <!-- Layer 1 <-> Layer 2 Connectors -->
  <g id="connectors-1-2">
    <line class="arrow-line" x1="240" y1="148" x2="240" y2="198"/>
    <polygon class="arrow-head" points="240,206 235.5,197 244.5,197"/>
    <rect x="146" y="165" width="188" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="240" y="180">assigns scoped worker briefs</text>

    <line class="arrow-line" x1="580" y1="206" x2="580" y2="156"/>
    <polygon class="arrow-head" points="580,148 575.5,157 584.5,157"/>
    <rect x="478" y="165" width="204" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="580" y="180">one-line receipts &amp; report files</text>
  </g>

  <!-- Layer 2: Google Antigravity Native Runtime -->
  <g id="layer-runtime">
    <rect x="12" y="206" width="796" height="136" rx="10" fill="var(--band-runtime)" stroke="var(--band-runtime-border)" stroke-width="1.25"/>
    <text class="band-title" x="28" y="230">Google Antigravity<tspan class="band-sub" dx="10">Native Agent Runtime</tspan></text>

    <!-- Node B1 -->
    <rect x="28" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="278">Swarm Board &amp; Workspaces</text>
    <text class="node-sub" x="144" y="299">Shared or isolated copies</text>

    <!-- Node B2 -->
    <rect x="294" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="278">Parallel Subagents</text>
    <text class="node-sub" x="410" y="299">Fallback when swarm is off</text>

    <!-- Node B3 -->
    <rect x="560" y="246" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="278">Event-Driven Wakeups</text>
    <text class="node-sub" x="676" y="299">Sleep idle, resume on finish</text>
  </g>

  <!-- Layer 2 <-> Layer 3 Connectors (Optional Companion) -->
  <g id="connectors-2-3">
    <line class="arrow-line" x1="240" y1="342" x2="240" y2="392" stroke-dasharray="4 3"/>
    <polygon class="arrow-head" points="240,400 235.5,391 244.5,391"/>
    <rect x="148" y="359" width="184" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="240" y="374">intercepts tool &amp; shell calls</text>

    <line class="arrow-line" x1="580" y1="400" x2="580" y2="350" stroke-dasharray="4 3"/>
    <polygon class="arrow-head" points="580,342 575.5,351 584.5,351"/>
    <rect x="478" y="359" width="204" height="22" rx="4" fill="var(--bg)"/>
    <text class="edge-label" x="580" y="374">compressed output &amp; audit logs</text>
  </g>

  <!-- Layer 3: Optional Agy-Context-Saver -->
  <g id="layer-acs">
    <rect x="12" y="400" width="796" height="136" rx="10" fill="var(--band-acs)" stroke="var(--band-acs-border)" stroke-width="1.25" stroke-dasharray="6 4"/>
    <text class="band-title" x="28" y="424" style="fill:var(--purple)">Agy-Context-Saver<tspan class="band-sub" dx="10">Optional Companion: Guard Hooks &amp; Transcript Forensics</tspan></text>

    <!-- Node C1 -->
    <rect x="28" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="144" y="472">Pre-Tool Guard Hook</text>
    <text class="node-sub" x="144" y="493">Bounds file reads &amp; access</text>

    <!-- C1 -> C2 -->
    <line class="arrow-line" x1="260" y1="479" x2="286" y2="479"/>
    <polygon class="arrow-head" points="294,479 285,474.5 285,483.5"/>

    <!-- Node C2 -->
    <rect x="294" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="410" y="472">Shell Output Compression</text>
    <text class="node-sub" x="410" y="493">Compact shell &amp; search logs</text>

    <!-- C2 -> C3 -->
    <line class="arrow-line" x1="526" y1="479" x2="552" y2="479"/>
    <polygon class="arrow-head" points="560,479 551,474.5 551,483.5"/>

    <!-- Node C3 -->
    <rect x="560" y="440" width="232" height="78" rx="6" fill="var(--card)" stroke="var(--card-border)" stroke-width="1"/>
    <text class="node-title" x="676" y="472">Transcript Forensics</text>
    <text class="node-sub" x="676" y="493">Trace audits &amp; poll limits</text>
  </g>
</svg>
