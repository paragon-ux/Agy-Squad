name: Publish npm package and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'publish' || github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    name: Release gate — Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json: ${package_version}"
          echo "git tag:      ${tag_version}"
          test "${package_version}" = "${tag_version}"
      - name: Run non-destructive release preflight
        run: node scripts/release-preflight.mjs
      - name: Run automated test suites
        run: npm test
      - name: Verify npm package content boundaries
        run: npm run verify:package

  publish:
    name: Publish and create release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global 'npm@11.21.3'
          node --version
          npm --version
      - name: Build publish tarball
        id: pack
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tarball="${package_name}-${package_version}.tgz"
          release_tag="v${package_version}"
          npm pack
          test -f "${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release and attach npm tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pack.outputs.release_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
            if printf '%s\n' "${existing_assets}" | grep -Fx -- "${TARBALL}" >/dev/null; then
              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "${tmp_dir}"' EXIT
              gh release download "${RELEASE_TAG}" --pattern "${TARBALL}" --output "${tmp_dir}/${TARBALL}"
              expected_sha="$(sha256sum "${TARBALL}" | awk '{print $1}')"
              actual_sha="$(sha256sum "${tmp_dir}/${TARBALL}" | awk '{print $1}')"
              if [ "${expected_sha}" != "${actual_sha}" ]; then
                echo "Error: existing release asset ${TARBALL} on ${RELEASE_TAG} does not match newly built tarball (${actual_sha} != ${expected_sha}); refusing to overwrite." >&2
                exit 1
              fi
              echo "✓ Release asset ${TARBALL} on ${RELEASE_TAG} already matches built tarball (${expected_sha}); skipping duplicate upload."
            else
              gh release upload "${RELEASE_TAG}" "${TARBALL}"
            fi
          else
            gh release create "${RELEASE_TAG}" "${TARBALL}" --verify-tag --generate-notes
          fi
      - name: Publish to npm (OIDC Trusted Publishing or NPM_TOKEN)
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "✓ ${pkg_name}@${pkg_version} is already published on npm; skipping duplicate publish."
            exit 0
          fi
          if [ -n "${NPM_TOKEN_SECRET}" ]; then
            export NODE_AUTH_TOKEN="${NPM_TOKEN_SECRET}"
          fi
          npm publish "${TARBALL}" --access public --provenance
